services:
  php:
    build:
      context: ./slim-framework
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./slim-framework:/var/www/html:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./slim-framework:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
