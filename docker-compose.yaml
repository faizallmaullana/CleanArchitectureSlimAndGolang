services:
  php:
    build:
      context: ./slim-framework
      dockerfile: Dockerfile
    working_dir: /var/www/html
    environment:
      MONGODB_URI: mongodb://app_user:app_password@mongodb:27017/app_db?authSource=admin
      MONGODB_DATABASE: app_db
    volumes:
      - ./slim-framework:/var/www/html:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./slim-framework:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_password
      MONGO_INITDB_DATABASE: app_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost -u root -p root_password --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root_password
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin_password
    ports:
      - "8082:8081"

  seeder:
    build:
      context: ./slim-framework
      dockerfile: Dockerfile
    working_dir: /var/www/html
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://app_user:app_password@mongodb:27017/app_db?authSource=admin
      MONGODB_DATABASE: app_db
    volumes:
      - ./slim-framework:/var/www/html:ro
    command: ["php", "database/seeder.php"]
    restart: "no"

volumes:
  mongodb_data:
