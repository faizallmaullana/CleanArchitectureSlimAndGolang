services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./go-postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - my_network

  adminer:
    image: adminer
    environment:
      - ADMINER_DESIGN=pepa-linha
    command: php -S 0.0.0.0:8080 -t /var/www/html
    ports:
      - "0.0.0.0:9000:8080"
    networks:
      - my_network
    restart: always

  api:
    build:
      context: ./go-postgres
      dockerfile: Dockerfile
      args:
        TARGET: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
      DB_SSLMODE: disable
    ports:
      - "8090:8080"

  seeder:
    build:
      context: ./go-postgres
      dockerfile: Dockerfile
      args:
        TARGET: seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
      DB_SSLMODE: disable
    restart: "no"

volumes:
  postgres_data:

networks:
  my_network:
    driver: bridge